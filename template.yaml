AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Agentics Code Team - Multi-Agent Code System.
  Etapa 1: Spec Agent + S3 artifacts bucket + DynamoDB runs table with optimistic locking.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage.

  ClaudeModel:
    Type: String
    Default: claude-opus-4-7
    Description: Anthropic model ID used by all agents.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch log retention for Lambda functions.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 300
    MemorySize: 1024
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: agentics-code-team
        POWERTOOLS_METRICS_NAMESPACE: AgenticsCodeTeam
        POWERTOOLS_LOG_LEVEL: INFO
        ARTIFACTS_BUCKET: !Ref ArtifactsBucket
        RUNS_TABLE: !Ref RunsTable
        ANTHROPIC_SECRET_ARN: !Ref AnthropicApiKeySecret
        CLAUDE_MODEL: !Ref ClaudeModel
        STAGE: !Ref Stage

Resources:

  # =========================================================================
  # S3 - Artifacts bucket (source code, ZIPs, generated artifacts per run)
  # =========================================================================
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "agentics-code-team-artifacts-${AWS::AccountId}-${Stage}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersionsAfter90Days
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: AbortIncompleteMultipartAfter7Days
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: agentics-code-team
        - Key: Stage
          Value: !Ref Stage

  # =========================================================================
  # DynamoDB - Runs state table with optimistic locking pattern
  #   PK = run_id (S)
  #   SK = item_type (S)  e.g. "RUN", "SPEC", "GEN#v1", "REVIEW#v1"
  #   Optimistic locking via `version` attribute + ConditionExpression
  #   GSI1 = status -> updated_at (for dashboards of in-flight runs)
  # =========================================================================
  RunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "agentics-runs-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
        - AttributeName: item_type
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
        - AttributeName: item_type
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1-Status-UpdatedAt
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: agentics-code-team
        - Key: Stage
          Value: !Ref Stage

  # =========================================================================
  # Secrets Manager - Anthropic API key
  # Populate post-deploy via:
  #   aws secretsmanager put-secret-value --secret-id <arn> \
  #     --secret-string '{"ANTHROPIC_API_KEY":"sk-ant-..."}'
  # =========================================================================
  AnthropicApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "agentics-code-team/${Stage}/anthropic-api-key"
      Description: Anthropic API key used by all agent Lambdas.
      SecretString: '{"ANTHROPIC_API_KEY":"REPLACE_ME_BEFORE_DEPLOY"}'
      Tags:
        - Key: Project
          Value: agentics-code-team
        - Key: Stage
          Value: !Ref Stage

  # =========================================================================
  # Lambda Layer - shared repos (DynamoDB + S3) and utilities
  # =========================================================================
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "agentics-shared-${Stage}"
      Description: Shared DynamoDB (optimistic locking) and S3 repos plus utilities.
      ContentUri: shared/layer/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  # =========================================================================
  # Spec Agent Lambda - turns raw user requirements into TechnicalSpec JSON.
  # =========================================================================
  SpecAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agentics-spec-agent-${Stage}"
      Description: Transforms user requirements into a structured TechnicalSpec (v1.0).
      CodeUri: lambdas/spec_agent/
      Handler: app.lambda_handler
      Timeout: 600
      MemorySize: 1024
      Layers:
        - !Ref SharedLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref AnthropicApiKeySecret

  SpecAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SpecAgentFunction}"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ArtifactsBucketName:
    Description: S3 bucket for source, artifacts and ZIPs.
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactsBucket"

  RunsTableName:
    Description: DynamoDB table for run state.
    Value: !Ref RunsTable
    Export:
      Name: !Sub "${AWS::StackName}-RunsTable"

  SpecAgentFunctionArn:
    Description: Spec Agent Lambda ARN.
    Value: !GetAtt SpecAgentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SpecAgentArn"

  AnthropicSecretArn:
    Description: Secret holding the Anthropic API key (JSON).
    Value: !Ref AnthropicApiKeySecret
    Export:
      Name: !Sub "${AWS::StackName}-AnthropicSecretArn"
