AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Agentics Code Team - Multi-Agent Code System.
  Etapa 1: Spec Agent + S3 artifacts bucket + DynamoDB runs table with optimistic locking.
  Etapa 2: CodeGen Agent + Review / Security / Scalability parallel validators.
  Etapa 3: Iterator Agent (deterministic ping-pong guard) + Step Functions orchestrator.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage.

  ClaudeModel:
    Type: String
    Default: claude-sonnet-4-6
    Description: Anthropic model ID used by all agents.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch log retention for Lambda functions.

  MaxIterations:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: Hard cap on corrective iterations per pipeline run.

  PipelineTimeoutSeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 43200
    Description: Wall-clock timeout for the whole State Machine execution.

  DiscordDMChannelId:
    Type: String
    Default: "1485389933807013932"
    Description: Discord DM channel ID where the notifier Lambda posts pipeline outcomes.

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    Timeout: 300
    MemorySize: 1024
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: agentics-code-team
        POWERTOOLS_METRICS_NAMESPACE: AgenticsCodeTeam
        POWERTOOLS_LOG_LEVEL: INFO
        ARTIFACTS_BUCKET: !Ref ArtifactsBucket
        RUNS_TABLE: !Ref RunsTable
        ANTHROPIC_SECRET_ARN: !Ref AnthropicApiKeySecret
        CLAUDE_MODEL: !Ref ClaudeModel
        STAGE: !Ref Stage

Resources:

  # =========================================================================
  # S3 - Artifacts bucket (source code, ZIPs, generated artifacts per run)
  # =========================================================================
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "agentics-code-team-artifacts-${AWS::AccountId}-${Stage}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersionsAfter90Days
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: AbortIncompleteMultipartAfter7Days
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: agentics-code-team
        - Key: Stage
          Value: !Ref Stage

  # =========================================================================
  # DynamoDB - Runs state table with optimistic locking pattern
  #   PK = run_id (S)
  #   SK = item_type (S)  e.g. "RUN", "SPEC", "GEN#v1", "REVIEW#v1"
  #   Optimistic locking via `version` attribute + ConditionExpression
  #   GSI1 = status -> updated_at (for dashboards of in-flight runs)
  # =========================================================================
  RunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "agentics-runs-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
        - AttributeName: item_type
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
        - AttributeName: item_type
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1-Status-UpdatedAt
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: agentics-code-team
        - Key: Stage
          Value: !Ref Stage

  # =========================================================================
  # Secrets Manager - Anthropic API key
  # Populate post-deploy via:
  #   aws secretsmanager put-secret-value --secret-id <arn> \
  #     --secret-string '{"ANTHROPIC_API_KEY":"sk-ant-..."}'
  # =========================================================================
  AnthropicApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "agentics-code-team/${Stage}/anthropic-api-key"
      Description: Anthropic API key used by all agent Lambdas.
      SecretString: '{"ANTHROPIC_API_KEY":"REPLACE_ME_BEFORE_DEPLOY"}'
      Tags:
        - Key: Project
          Value: agentics-code-team
        - Key: Stage
          Value: !Ref Stage

  # =========================================================================
  # Discord bot token - used by the DiscordNotifier Lambda to DM the user
  # when a pipeline run terminates. Populate post-deploy with:
  #   aws secretsmanager put-secret-value \
  #     --secret-id <DiscordBotTokenSecret ARN> \
  #     --secret-string '{"DISCORD_BOT_TOKEN":"<bot token>"}'
  # =========================================================================
  DiscordBotTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "agentics-code-team/${Stage}/discord-bot-token"
      Description: Discord bot token for the pipeline-terminal notifier.
      SecretString: '{"DISCORD_BOT_TOKEN":"REPLACE_ME_BEFORE_DEPLOY"}'
      Tags:
        - Key: Project
          Value: agentics-code-team
        - Key: Stage
          Value: !Ref Stage

  # =========================================================================
  # Lambda Layer - shared runtime deps (anthropic, pydantic, powertools, boto3)
  # plus shared modules (DynamoDB repo with optimistic locking, S3 repo,
  # Claude client, JSON extractor, validator runner + schemas).
  # Centralizing heavy deps here avoids duplicating ~15MB per Lambda across
  # the 5 agent functions.
  # =========================================================================
  AgenticsSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "agentics-shared-${Stage}"
      Description: Shared deps (anthropic, pydantic, powertools) + repos and utilities.
      ContentUri: shared/layer/
      CompatibleRuntimes: [python3.11]
      CompatibleArchitectures: [x86_64]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11

  # =========================================================================
  # Spec Agent Lambda - turns raw user requirements into TechnicalSpec JSON.
  # =========================================================================
  SpecAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agentics-spec-agent-${Stage}"
      Description: Transforms user requirements into a structured TechnicalSpec (v1.0).
      CodeUri: lambdas/spec_agent/
      Handler: app.lambda_handler
      Timeout: 600
      MemorySize: 1024
      Layers:
        - !Ref AgenticsSharedLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref AnthropicApiKeySecret

  SpecAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SpecAgentFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # CodeGen Agent Lambda - consumes TechnicalSpec, emits generated source
  # files under artifacts/<run_id>/v<n>/ plus a manifest.json with pointers.
  # =========================================================================
  CodeGenAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agentics-codegen-agent-${Stage}"
      Description: Generates source code from a TechnicalSpec and uploads files to S3.
      CodeUri: lambdas/codegen_agent/
      Handler: codegen.lambda_handler
      Timeout: 900
      MemorySize: 2048
      Layers:
        - !Ref AgenticsSharedLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref AnthropicApiKeySecret

  CodeGenAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CodeGenAgentFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # Review Agent Lambda - code quality / maintainability / spec alignment.
  # Runs in parallel with Security and Scalability agents from Step Functions.
  # =========================================================================
  ReviewAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agentics-review-agent-${Stage}"
      Description: Reviews generated code for quality and spec alignment.
      CodeUri: lambdas/review_agent/
      Handler: review.lambda_handler
      Timeout: 600
      MemorySize: 1024
      Layers:
        - !Ref AgenticsSharedLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref AnthropicApiKeySecret

  ReviewAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReviewAgentFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # Security Agent Lambda - OWASP Top 10 / injection / secrets / authz.
  # =========================================================================
  SecurityAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agentics-security-agent-${Stage}"
      Description: Scans generated code for security issues (OWASP Top 10, injection, authz).
      CodeUri: lambdas/security_agent/
      Handler: security.lambda_handler
      Timeout: 600
      MemorySize: 1024
      Layers:
        - !Ref AgenticsSharedLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref AnthropicApiKeySecret

  SecurityAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SecurityAgentFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # Scalability Agent Lambda - latency / memory / cost / cold starts / N+1.
  # =========================================================================
  ScalabilityAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agentics-scalability-agent-${Stage}"
      Description: Assesses generated code for scalability, perf and cost risks.
      CodeUri: lambdas/scalability_agent/
      Handler: scalability.lambda_handler
      Timeout: 600
      MemorySize: 1024
      Layers:
        - !Ref AgenticsSharedLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref AnthropicApiKeySecret

  ScalabilityAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScalabilityAgentFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # Iterator Agent Lambda - deterministic ping-pong guard + fix dispatcher.
  # Reads the 3 validator reports, fingerprints persistent issues, and decides
  # whether to loop (ITERATOR_READY), converge (ITERATOR_DONE), or abort
  # (ITERATOR_EXHAUSTED / ITERATOR_UNRESOLVABLE). Pure logic — no LLM call.
  # =========================================================================
  IteratorAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agentics-iterator-agent-${Stage}"
      Description: Aggregates validator reports and decides loop / converge / abort.
      CodeUri: lambdas/iterator_agent/
      Handler: iterator.lambda_handler
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref AgenticsSharedLayer
      Environment:
        Variables:
          MAX_ITERATIONS: !Ref MaxIterations
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ArtifactsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable

  IteratorAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IteratorAgentFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # Discord Notifier Lambda - subscribes to AgenticsAlertsTopic and posts a
  # Discord DM when the State Machine publishes a terminal event
  # (DONE / EXHAUSTED / UNRESOLVABLE / FAILED).
  # =========================================================================
  DiscordNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agentics-discord-notifier-${Stage}"
      Description: Posts a Discord DM when a pipeline run reaches a terminal state.
      CodeUri: lambdas/discord_notifier/
      Handler: app.lambda_handler
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref AgenticsSharedLayer
      Environment:
        Variables:
          DISCORD_DM_CHANNEL_ID: !Ref DiscordDMChannelId
          DISCORD_SECRET_ARN: !Ref DiscordBotTokenSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RunsTable
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref DiscordBotTokenSecret
      Events:
        PipelineTerminalEvent:
          Type: SNS
          Properties:
            Topic: !Ref AgenticsAlertsTopic

  DiscordNotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DiscordNotifierFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # Step Functions - main pipeline orchestrator.
  # Flow: SpecAgent -> CodeGen -> (Review || Security || Scalability) -> Iterator
  #       Loop back to CodeGen while Iterator says ITERATOR_READY.
  #       Hard cap at MAX_ITERATIONS=3 (enforced in iterator_schemas).
  # =========================================================================
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/agentics-main-${Stage}"
      RetentionInDays: !Ref LogRetentionDays

  MainStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "agentics-main-${Stage}"
      DefinitionUri: statemachine/main.asl.json
      DefinitionSubstitutions:
        SpecAgentFunctionArn: !GetAtt SpecAgentFunction.Arn
        CodeGenAgentFunctionArn: !GetAtt CodeGenAgentFunction.Arn
        ReviewAgentFunctionArn: !GetAtt ReviewAgentFunction.Arn
        SecurityAgentFunctionArn: !GetAtt SecurityAgentFunction.Arn
        ScalabilityAgentFunctionArn: !GetAtt ScalabilityAgentFunction.Arn
        IteratorAgentFunctionArn: !GetAtt IteratorAgentFunction.Arn
        PipelineTimeoutSeconds: !Ref PipelineTimeoutSeconds
        AlertsTopicArn: !Ref AgenticsAlertsTopic
      Tracing:
        Enabled: true
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref SpecAgentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CodeGenAgentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ReviewAgentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SecurityAgentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ScalabilityAgentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref IteratorAgentFunction
        - CloudWatchLogsFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: [sns:Publish]
              Resource: !Ref AgenticsAlertsTopic
      Tags:
        Project: agentics-code-team
        Stage: !Ref Stage

  # =========================================================================
  # Operational alerts — SNS topic + CloudWatch alarms.
  # Subscriptions (email, Slack webhook, PagerDuty) are intentionally NOT
  # provisioned here. Post-deploy, attach them via:
  #   aws sns subscribe --topic-arn <arn> --protocol email --notification-endpoint <addr>
  # =========================================================================
  AgenticsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "agentics-alerts-${Stage}"
      DisplayName: !Sub "Agentics Code Team Alerts (${Stage})"
      Tags:
        - Key: Project
          Value: agentics-code-team
        - Key: Stage
          Value: !Ref Stage

  AlarmPipelineFailures:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "agentics-pipeline-failures-${Stage}"
      AlarmDescription: Step Functions execution failures in the last 5 minutes.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref MainStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AgenticsAlertsTopic

  AlarmPipelineExhausted:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "agentics-pipeline-exhausted-${Stage}"
      AlarmDescription: Pipeline reached MAX_ITERATIONS without converging.
      Namespace: AgenticsCodeTeam
      MetricName: IteratorIterations
      Dimensions:
        - Name: stage
          Value: !Ref Stage
        - Name: outcome
          Value: exhausted
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AgenticsAlertsTopic

  AlarmSpecAgentErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "agentics-spec-agent-errors-${Stage}"
      AlarmDescription: Spec Agent Lambda is erroring.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SpecAgentFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AgenticsAlertsTopic

  AlarmCodeGenErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "agentics-codegen-errors-${Stage}"
      AlarmDescription: CodeGen Agent Lambda is erroring.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CodeGenAgentFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AgenticsAlertsTopic

Outputs:
  ArtifactsBucketName:
    Description: S3 bucket for source, artifacts and ZIPs.
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactsBucket"

  RunsTableName:
    Description: DynamoDB table for run state.
    Value: !Ref RunsTable
    Export:
      Name: !Sub "${AWS::StackName}-RunsTable"

  SpecAgentFunctionArn:
    Description: Spec Agent Lambda ARN.
    Value: !GetAtt SpecAgentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SpecAgentArn"

  CodeGenAgentFunctionArn:
    Description: CodeGen Agent Lambda ARN.
    Value: !GetAtt CodeGenAgentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CodeGenAgentArn"

  ReviewAgentFunctionArn:
    Description: Review Agent Lambda ARN.
    Value: !GetAtt ReviewAgentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReviewAgentArn"

  SecurityAgentFunctionArn:
    Description: Security Agent Lambda ARN.
    Value: !GetAtt SecurityAgentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SecurityAgentArn"

  ScalabilityAgentFunctionArn:
    Description: Scalability Agent Lambda ARN.
    Value: !GetAtt ScalabilityAgentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ScalabilityAgentArn"

  IteratorAgentFunctionArn:
    Description: Iterator Agent Lambda ARN.
    Value: !GetAtt IteratorAgentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-IteratorAgentArn"

  MainStateMachineArn:
    Description: Main Step Functions state machine ARN.
    Value: !Ref MainStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-MainStateMachineArn"

  AgenticsSharedLayerArn:
    Description: ARN of the shared Lambda Layer consumed by all agents.
    Value: !Ref AgenticsSharedLayer
    Export:
      Name: !Sub "${AWS::StackName}-SharedLayerArn"

  AnthropicSecretArn:
    Description: Secret holding the Anthropic API key (JSON).
    Value: !Ref AnthropicApiKeySecret
    Export:
      Name: !Sub "${AWS::StackName}-AnthropicSecretArn"

  AgenticsAlertsTopicArn:
    Description: SNS topic for pipeline alarms. Attach subscriptions post-deploy.
    Value: !Ref AgenticsAlertsTopic
    Export:
      Name: !Sub "${AWS::StackName}-AgenticsAlertsTopicArn"

  DiscordBotTokenSecretArn:
    Description: Secret holding the Discord bot token. Populate post-deploy with put-secret-value.
    Value: !Ref DiscordBotTokenSecret
    Export:
      Name: !Sub "${AWS::StackName}-DiscordBotTokenSecretArn"

  DiscordNotifierFunctionArn:
    Description: Discord Notifier Lambda ARN.
    Value: !GetAtt DiscordNotifierFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DiscordNotifierArn"
